[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcrop"
version = "0.1.0"
description = "Desktop-first AI aesthetic cropping demo powered by Venus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]
venus = [
  "accelerate>=0.21,<1",
  "bitsandbytes>=0.45,<1",
  "einops>=0.6,<1",
  "scipy>=1.10,<2",
  "tiktoken>=0.5,<1",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers==4.32.0",
  "transformers-stream-generator==0.0.4",
]

[project.scripts]
smartcrop-api = "smartcrop_api.cli:main"
smartcrop-worker = "smartcrop_worker.cli:main"

[tool.setuptools.packages.find]
where = [
  "apps/api/src",
  "workers/venus/src",
  "packages/contracts/src",
  "packages/image-core/src",
  "packages/runtime/src",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".agents",
  ".venv",
  "Venus_CVPR2026",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
