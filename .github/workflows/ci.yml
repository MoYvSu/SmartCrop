name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Resolve from the frontend workspace so its custom storeDir is respected.
      - name: Resolve pnpm store
        id: pnpm_cache
        run: echo "path=$(pnpm --dir apps/web store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_cache.outputs.path }}
          key: ${{ runner.os }}-pnpm-11-${{ hashFiles('apps/web/pnpm-lock.yaml', 'apps/web/pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-11-
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
